server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST y artefactos de imagen: proxy directo al factoryd
    location /api/ {
        proxy_pass http://factory:8610;
        proxy_read_timeout 3600s;
    }

    location /img/ {
        proxy_pass http://factory:8610;
        proxy_read_timeout 3600s;
    }

    # streaming de video (Range) para el reproductor estilo YouTube
    location /media/ {
        proxy_pass http://factory:8610;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # WebSocket de eventos en vivo
    location /ws {
        proxy_pass http://factory:8610;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3660s;
        proxy_send_timeout 3660s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
    }
}
