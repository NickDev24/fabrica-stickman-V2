<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #10151d; overflow: hidden; }
  canvas { display: block; }
</style>
<script src="/factory/render/vendor/babylon/babylon.js"></script>
<script src="/factory/render/vendor/babylon/babylonjs.loaders.min.js"></script>
</head>
<body>
</body>
<script>
/* Motor de actuación sobre BABYLON.JS (decisión del dueño, 2026-11-06: reemplaza Three.js).
   Contrato con el driver CDP (factory/render/cdp.mjs), intacto:
     window.actorInit() -> Promise<{modo, registro}>
     window.actorCargar(timeline)
     window.actorFrame(t) -> bool
     window.actorSnapshot() -> base64 PNG
     window.actorEstado() -> {modo, apertura_boca}
   Config inyectada por el driver: __CONFIG__ (JSON con visemas, rig_map y ruta glb). */
const CONFIG = __CONFIG__;

let engine, scene, camera;
let glb = null;           // datos del GLB cargado
let nodos = null;         // nodos nombrados del GLB: rig por transformación, sin skinning
let caraY = null;         // altura de la cabeza ya normalizada; encuadre relativo a la cara
let floor = null;
let fig = null;           // piezas del actor procedural de validación
let modo = 'init';
const V = CONFIG.visema;
const D2R = Math.PI / 180;

const col3 = (h) => new BABYLON.Color3((h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255);

function luz() {
  /* THREE HemisphereLight(0xbfd4ff, 0x3a3230, 0.55) */
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
  hemi.diffuse = col3(0xbfd4ff);
  hemi.groundColor = col3(0x3a3230);
  hemi.intensity = 0.55;
  /* direccional con posición: la dirección es (objetivo - posición) apuntando al origen */
  const key = new BABYLON.DirectionalLight("key",
    new BABYLON.Vector3(1.6, 2.6, 2.8).negate().normalize(), scene);
  key.diffuse = col3(0xffefd2);
  key.intensity = 1.15;
  const rim = new BABYLON.DirectionalLight("rim",
    new BABYLON.Vector3(-2.2, 1.4, -2.6).negate().normalize(), scene);
  rim.diffuse = col3(0x88aaff);
  rim.intensity = 0.4;
}

function std(c, rough) {
  /* MeshStandardMaterial: rough alto = spec bajito; glossy = reflejo visible */
  const m = new BABYLON.StandardMaterial("std", scene);
  m.diffuseColor = col3(c);
  const s = 0.30 * (1 - rough);
  m.specularColor = new BABYLON.Color3(s, s, s);
  m.specularPower = rough < 0.3 ? 96 : 40;
  return m;
}

function glow(c) {
  /* MeshBasicMaterial = sin luz: emissive pleno */
  const m = new BABYLON.StandardMaterial("glow", scene);
  m.diffuseColor = new BABYLON.Color3(0, 0, 0);
  m.emissiveColor = col3(c);
  m.disableLighting = true;
  return m;
}

function suelo() {
  /* CircleGeometry(9, 48) rotada al plano horizontal */
  const g = BABYLON.MeshBuilder.CreateDisc("suelo", { radius: 9, tessellation: 48 });
  g.rotation.x = -Math.PI / 2;
  g.position.y = -1.45;
  const m = std(0x1a222e, 0.9);
  m.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
  g.material = m;
  floor = g;
}

/* Actor del personaje 4F (Pulso Curioso) montado proceduralmente: paleta neón
   (#00FF00 / #FF00FF / #00FFFF / #111111 / #1A1A1A), gorra 4F, hoodie con tiras neón y
   ojos glow de visera. Nada orgánico, nada de cara humana: visera digital.
   El GLB del usuario lo reemplaza por completo vía rig_map. */
function figuraProcedural() {
  const VERDE = 0x00ff00, MAGENTA = 0xff00ff, CIAN = 0x00ffff;
  const dark = (c) => std(c, 0.5);
  const gloss = (c) => std(c, 0.14);
  const textura4F = () => {
    const tex = new BABYLON.DynamicTexture("logo4f", { width: 128, height: 96 }, scene, false);
    const cx = tex.getContext();
    cx.clearRect(0, 0, 128, 96);
    cx.font = 'bold 56px monospace';
    cx.fillStyle = '#00ff00';
    cx.textAlign = 'center';
    cx.shadowColor = '#00ff00'; cx.shadowBlur = 14;
    cx.fillText('4F', 64, 68);
    tex.update();
    tex.hasAlpha = true;
    return tex;
  };
  const g = new BABYLON.TransformNode("grupo", scene);
  const cuello = new BABYLON.TransformNode("cuello", scene);
  const cabeza = new BABYLON.TransformNode("cabeza", scene);

  // casco táctico glossy cerrado (prohibida la cara orgánica; lámina: visera digital)
  const craneo = BABYLON.MeshBuilder.CreateSphere("craneo", { diameter: 1.0, segments: 32 }, scene);
  craneo.material = gloss(0x0e0e0e);
  craneo.scaling.set(1, 1.14, 0.92);
  // capucha: banda baja del casco. (THREE usaba theta 0.52π→1.0π; Babylon bautiza la banda
  // desde el polo superior, se gira 180° para que caiga abajo.)
  const capucha = BABYLON.MeshBuilder.CreateSphere("capucha",
    { diameter: 1.12, segments: 16, slice: 0.24, arc: 1 }, scene);
  capucha.material = dark(0x1a1a1a);
  capucha.rotation.x = Math.PI;
  capucha.position.z = -0.08; capucha.scaling.set(1, 0.92, 1);
  const gorroBanda = BABYLON.MeshBuilder.CreateSphere("gorroBanda",
    { diameter: 1.01, segments: 12, slice: 0.17, arc: 1 }, scene);
  gorroBanda.material = dark(0x141414);
  gorroBanda.position.y = 0.1;
  // visera: panel de vidrio negro al frente (cuña frontal del casco)
  const visor = BABYLON.MeshBuilder.CreateSphere("visor",
    { diameter: 1.014, segments: 16, slice: 0.124, arc: 0.197 }, scene);
  visor.material = gloss(0x0b0b0b);
  visor.rotation.x = -(1.33 + 0.78 / 2 - Math.PI / 2) * 0.5;   // calibéra la banda al frente-bajo
  // logo 4F glow verde en la banda del casco
  const logo = BABYLON.MeshBuilder.CreatePlane("logo", { width: 0.14, height: 0.105, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  const mlogo = new BABYLON.StandardMaterial("mlogo", scene);
  mlogo.emissiveTexture = textura4F();
  mlogo.opacityTexture = mlogo.emissiveTexture;   // alpha del canvas: texto visible, caja invisible
  mlogo.opacityTexture.getAlphaFromRGB = true;
  mlogo.disableLighting = true;
  logo.material = mlogo;
  logo.position.set(0.0, 0.33, 0.42);
  logo.rotation.x = -0.35;
  // ojos glow de la visera (párpados asimétricos por rotación)
  const ojoL = BABYLON.MeshBuilder.CreateDisc("ojoL", { radius: 0.105, tessellation: 20 }, scene);
  ojoL.material = glow(VERDE);
  ojoL.position.set(-0.175, 0.075, 0.478);
  ojoL.rotation.z = -0.35;
  const ojoR = BABYLON.MeshBuilder.CreateDisc("ojoR", { radius: 0.105, tessellation: 20 }, scene);
  ojoR.material = glow(VERDE);
  ojoR.position.set(0.175, 0.075, 0.478);
  ojoR.rotation.z = 0.35;
  // fila de SÍMBOLOS bajo los ojos: pulsan con la LOCUCIÓN (lip-sync del casco)
  const symbols = [];
  for (const [i, x] of [[0, -0.085], [1, 0], [2, 0.085]].entries()) {
    const s = BABYLON.MeshBuilder.CreateDisc("sym" + i, { radius: 0.028, tessellation: 14 }, scene);
    s.material = glow(VERDE);
    s.position.set(x, -0.135 + (i === 1 ? 0.022 : 0), 0.49);
    symbols.push(s);
    s.parent = cabeza;
  }
  for (const pieza of [craneo, capucha, gorroBanda, visor, logo, ojoL, ojoR]) pieza.parent = cabeza;

  // torso/hoodie: negro con tiras neón magenta+cian (sin morphing, sin labios orgánicos)
  const torso = BABYLON.MeshBuilder.CreateCapsule("torso",
    { radius: 0.38, height: 1.26, tessellation: 20, subdivisions: 8 }, scene);
  torso.material = dark(0x151515);
  torso.position.y = -0.95;
  const collar = BABYLON.MeshBuilder.CreateTorus("collar",
    { diameter: 2 * 0.33, thickness: 0.1, tessellation: 24 }, scene);
  collar.material = dark(0x1a1a1a);
  collar.rotation.x = Math.PI / 2; collar.position.y = -0.42;
  const tiraM = BABYLON.MeshBuilder.CreateCylinder("tiraM",
    { height: 0.5, diameter: 0.024, tessellation: 6 }, scene);
  tiraM.material = glow(MAGENTA);
  tiraM.rotation.z = 0.12; tiraM.position.set(-0.08, -0.62, 0.37);
  const tiraC = BABYLON.MeshBuilder.CreateCylinder("tiraC",
    { height: 0.5, diameter: 0.024, tessellation: 6 }, scene);
  tiraC.material = glow(CIAN);
  tiraC.rotation.z = -0.12; tiraC.position.set(0.08, -0.62, 0.37);
  const brazoL = BABYLON.MeshBuilder.CreateCapsule("brazoL",
    { radius: 0.09, height: 0.58, tessellation: 12, subdivisions: 6 }, scene);
  brazoL.material = dark(0x151515);
  brazoL.position.set(-0.45, -0.78, 0);
  const brazoR = BABYLON.MeshBuilder.CreateCapsule("brazoR",
    { radius: 0.09, height: 0.58, tessellation: 12, subdivisions: 6 }, scene);
  brazoR.material = dark(0x151515);
  brazoR.position.set(0.45, -0.78, 0);
  const punoL = BABYLON.MeshBuilder.CreateSphere("punoL", { diameter: 0.14, segments: 10 }, scene);
  punoL.material = glow(CIAN);
  punoL.position.set(-0.45, -1.02, 0);
  punoL.parent = g;
  const punoR = BABYLON.MeshBuilder.CreateSphere("punoR", { diameter: 0.14, segments: 10 }, scene);
  punoR.material = glow(MAGENTA);
  punoR.position.set(0.45, -1.02, 0);
  punoR.parent = g;

  for (const pieza of [torso, collar, tiraM, tiraC, brazoL, brazoR]) pieza.parent = g;
  cuello.parent = g; cuello.position.y = 0.05;
  cabeza.parent = cuello; cabeza.position.y = 0.62;
  g.position.y = -0.55;
  fig = { g, cuello, ojoL, ojoR, symbols, brazoL, brazoR,
          verde: col3(VERDE) };
  modo = 'mascota4f_procedural';
}

/* Aplica el rig (bloque de estados.py) + visema + blink al actor 4F.
   REGLAS duras: sin flicker (brillo determinista de t), sin morphing activo,
   proporciones fijas (solo transformaciones de la propia figura). */
function aplicarAProcedural(rig, apertura, ojoFactor, t) {
  const { g, cuello, ojoL, ojoR, symbols, brazoL, brazoR, verde } = fig;
  g.rotation.z = (rig.postura_roll || 0) * D2R * 0.6;
  g.position.x = (rig.peso || 0) * 0.06;
  // inclinar torso para adelante cuando explica datos (manos activas)
  g.rotation.x = 0.07 * (rig.manos_levantadas || 0);
  cuello.rotation.x = (rig.cabeza_pitch || 0) * D2R;
  cuello.rotation.y = (rig.cabeza_yaw || 0) * D2R;
  cuello.rotation.z = (rig.cabeza_roll || 0) * D2R;
  const dx = rig.mirada_dx || 0, dy = rig.mirada_dy || 0;
  ojoL.position.x = -0.175 + dx * 0.03;
  ojoR.position.x = 0.175 + dx * 0.03;
  const ci = rig.ceja_izq || 0, cd = rig.ceja_der || 0;
  // párpados asimétricos por emoción (lámina 4F) + apertura/parpadeo
  const ab = Math.max(0.06, Math.min(1.35, (rig.ojo_apertura || 1) * ojoFactor));
  ojoL.scaling.y = ab; ojoR.scaling.y = ab;
  ojoL.rotation.z = -0.35 + ci * 0.55;
  ojoR.rotation.z = 0.35 - cd * 0.55;
  ojoL.position.y = 0.075 + dy * 0.025 + ci * 0.02;
  ojoR.position.y = 0.075 + dy * 0.025 + cd * 0.02;
  // lip-sync del casco: los tres símbolos pulsan con la locución (visema) y
  // se atenúan en silencios; brillo determinista de t (sin flicker)
  const brillo = 0.22 + Math.min(1.2, apertura) * 1.6;
  for (let i = 0; i < symbols.length; i++) {
    const s = symbols[i];
    const fase = 0.85 + 0.15 * Math.sin(t * 6.28 + i * 1.1);
    s.material.emissiveColor.copyFrom(verde).scaleInPlace(Math.min(2, brillo * fase));
    s.scaling.y = 0.45 + apertura * 0.9;
    s.scaling.x = 1 - apertura * 0.12;
  }
  const vel = rig.velocidad_gesto || 1;
  const sw = Math.sin(t * 2.1 * vel) * 0.1;
  brazoL.rotation.x = (rig.brazo_izq || 0) * 0.7 + sw;
  brazoR.rotation.x = (rig.brazo_der || 0) * 0.7 - sw;
  brazoL.rotation.z = 0.12 + (rig.codo_izq || 0) * 0.5;
  brazoR.rotation.z = -0.12 - (rig.codo_der || 0) * 0.5;
  brazoL.position.y = -0.78 + (rig.manos_levantadas || 0) * 0.25;
  brazoR.position.y = -0.78 + (rig.manos_levantadas || 0) * 0.25;
  g.scaling.y = 1 + Math.sin(t * ((rig.respiracion || 14) / 60) * 2 * Math.PI) * 0.008;
}

/* Aplica rig al GLB vía rig_map: {morfos:{param:[nombres...]}, huesos:{param:[nombre,eje,signo...]}} */
/* Rig por NODOS: un personaje sin pesos de vértice (nuestro cloak man) se anima moviendo
   transformaciones de nodo. Cada def es [nodo, op, eje, factor, modo?]:
     rot  -> grados por unidad      pos -> metros sobre la posición base
     esc  -> escala base + v*factor; con modo "fija" la escala ES v (apertura ocular).  */
function nodoDe(nombre) { return nodos ? nodos.get(String(nombre).toLowerCase()) : null; }

function aplicarNodo(def, v) {
  const reg = nodoDe(def[0]);
  if (!reg) return false;
  const [, op, eje, factor, modoEsc] = def;
  const f = factor === undefined ? 1 : factor;
  if (op === 'rot') reg.obj.rotation[eje] = (v * f) * D2R;
  else if (op === 'pos') reg.obj.position[eje] = reg.basePos[eje] + v * f;
  else if (op === 'esc') reg.obj.scaling[eje] = modoEsc === 'fija'
    ? Math.max(0.03, Math.min(1.6, v)) : Math.max(0.02, reg.baseScale[eje] + v * f);
  return true;
}

function aplicarAGlb(rig, apertura, ojoFactor, t) {
  if (!glb) return;
  const morfos = CONFIG.rig_map.morfos || {};
  for (const [param, claves] of Object.entries(morfos)) {
    let v = rig[param];
    if (v === undefined) continue;
    if (param === 'ojo_apertura') v = Math.max(0.05, Math.min(1.35, v * ojoFactor));
    for (const c of claves) {
      for (const tgt of glb.morfos.get(c) || []) {
        tgt.influence = Math.max(0, Math.min(1, v));
      }
    }
  }
  /* visema sobre morfos de boca si el GLB define 'mouthOpen' u similares */
  const bocaKeys = CONFIG.rig_map.visema_morphs || ['mouthOpen'];
  for (const c of bocaKeys) {
    for (const tgt of glb.morfos.get(c) || []) {
      tgt.influence = Math.max(0, Math.min(1, apertura));
    }
  }
  const huesos = CONFIG.rig_map.huesos || {};
  for (const [param, defs] of Object.entries(huesos)) {
    let v = rig[param];
    if (v === undefined) continue;
    for (const d of defs) {
      const [nombre, eje, signo] = d;
      const b = glb.huesos.get(String(nombre).toLowerCase());
      if (b) b.rotation[eje] = ((v * (signo === undefined ? 1 : signo))) * D2R;
    }
  }
  /* --- rig por nodos (personajes sin skinning) --- */
  const ojoAp = Math.max(0.05, Math.min(1.35, (rig.ojo_apertura === undefined ? 1 : rig.ojo_apertura) * ojoFactor));
  for (const [param, defs] of Object.entries(CONFIG.rig_map.nodos || {})) {
    let v = rig[param];
    if (v === undefined) continue;
    if (param === 'ojo_apertura') v = ojoAp;
    for (const d of defs) aplicarNodo(d, v);
  }
  for (const d of (CONFIG.rig_map.visema_nodos || [])) aplicarNodo(d, apertura);
  const rb = CONFIG.rig_map.respiracion_nodo && nodoDe(CONFIG.rig_map.respiracion_nodo);
  if (rb) {
    const rpm = rig.respiracion || 14;
    rb.obj.scaling.y = rb.baseScale.y * (1 + Math.sin(t * (rpm / 60) * 2 * Math.PI) * 0.014);
  }
}

/* cámara: plano/movimiento de la timeline -> posición suave */
function camaraEn(t, plan) {
  let plano = plan[plan.length - 1];
  for (const p of plan) if (t >= p.t0 && t < p.t1) { plano = p; break; }
  const DIST = { primerisimo_primer_plano: 1.05, primer_plano: 1.5, medio: 2.6, general: 4.2, contrapicado: 2.0 };
  const ALT = { primerisimo_primer_plano: 0.95, primer_plano: 1.05, medio: 1.15, general: 1.25, contrapicado: 0.55 };
  const CARA = { primerisimo_primer_plano: [0.85, 0.00, 0.00], primer_plano: [1.20, 0.03, -0.03],
                 medio: [2.05, 0.06, -0.18], general: [3.10, 0.14, -0.42], contrapicado: [1.50, -0.34, 0.05] };
  let d = DIST[plano.tipo] ?? 2.6;
  let alt = ALT[plano.tipo] ?? 1.1;
  let lookY = alt - 0.12;
  if (caraY !== null) {
    /* Con un GLB de cuerpo entero la cara no está en y=1.1: el plano se define RELATIVO
       a la cabeza, si no el primer plano sale encuadrando el pecho. */
    const c = CARA[plano.tipo] ?? CARA.medio;
    d = c[0]; alt = caraY + c[1]; lookY = caraY + c[2];
  }
  let dx = 0, dz = 0;
  const frac = Math.min(1, Math.max(0, (t - plano.t0) / Math.max(0.1, plano.t1 - plano.t0)));
  if (plano.mov === 'zoom_lento') dz = -0.35 * frac;
  if (plano.mov === 'acercamiento_lento') dz = -0.55 * frac;
  if (plano.mov === 'lento_lateral') dx = 0.4 * Math.sin((t - plano.t0) * 0.4);
  if (plano.mov === 'leve_travelling') dx = 0.18 * Math.sin((t - plano.t0) * 0.5);
  if (plano.mov === 'titubeo') { dx = 0.04 * Math.sin(t * 5.3); dz = 0.03 * Math.sin(t * 4.1); }
  camera.position.set(dx, alt + 0.08 * Math.sin(t * 0.5), d + dz);
  camera.setTarget(new BABYLON.Vector3(0, lookY, 0.25));
}

/* interpolación suave entre el bloque del segmento activo y el siguiente (0.45 s) */
function rigEn(t, segs, trans_s) {
  let rig = null;
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (t < s.t0) { rig = i > 0 ? segs[i - 1].rig : segs[0].rig; break; }
    if (t >= s.t0 && t < s.t1) {
      const nx = segs[Math.min(segs.length - 1, i + 1)];
      const a = Math.min(1, (t - s.t0) / trans_s);
      rig = {};
      for (const k of Object.keys(s.rig)) rig[k] = s.rig[k] + ((nx.rig[k] ?? s.rig[k]) - s.rig[k]) * a;
      break;
    }
    rig = s.rig;
  }
  if (!rig) rig = segs[segs.length - 1] ? segs[segs.length - 1].rig : {};
  return rig;
}

function visemaEn(t, cues) {
  let vis = 'X', edad = 1e9;
  for (const c of cues) { if (c.t <= t) { vis = c.v; edad = t - c.t; } else break; }
  // La mandíbula no se queda congelada en el último fonema: se relaja hacia el reposo.
  if (edad > 0.22) vis = 'X';
  return V[vis] ?? 0.1;
}

function blinkEn(t, blinks) {
  let f = 1;
  for (const b of blinks) {
    if (Math.abs(t - b) < 0.09) f = Math.min(f, Math.abs(t - b) / 0.09);
  }
  return Math.max(0.06, f);
}

function registrarDescendientes(raiz, registro) {
  /* Babylon: morph targets viven en mesh.morphTargetManager; los huesos glTF importan
     como TransformNode + skeleton vinculado. El rig por nodos usa transformaciones. */
  const morfos = new Map(), huesos = new Map(), ns = new Map();
  const meshes = raiz.getChildMeshes(false);
  for (const mesh of meshes) {
    if (mesh.morphTargetManager) {
      for (const tgt of mesh.morphTargetManager.getTargets()) {
        if (!morfos.has(tgt.name)) morfos.set(tgt.name, []);
        morfos.get(tgt.name).push(tgt);
        registro.morfos.push(tgt.name);
      }
    }
    if (mesh.skeleton) {
      for (const bn of mesh.skeleton.bones) {
        const tn = bn.getTransformNode();
        if (tn) {
          huesos.set(String(tn.name).toLowerCase(), tn);
          registro.huesos.push(tn.name);
          if (!ns.has(String(tn.name).toLowerCase())) {
            ns.set(String(tn.name).toLowerCase(), {
              obj: tn, basePos: { x: tn.position.x, y: tn.position.y, z: tn.position.z },
              baseScale: { x: tn.scaling.x, y: tn.scaling.y, z: tn.scaling.z } });
            registro.nodos.push(tn.name);
          }
        } else {
          huesos.set(String(bn.name).toLowerCase(), bn);
          registro.huesos.push(bn.name);
        }
      }
    }
  }
  for (const tn of raiz.getChildTransformNodes(true)) {
    const k = String(tn.name).toLowerCase();
    if (tn.name && !ns.has(k)) {
      ns.set(k, { obj: tn, basePos: { x: tn.position.x, y: tn.position.y, z: tn.position.z },
                  baseScale: { x: tn.scaling.x, y: tn.scaling.y, z: tn.scaling.z } });
      registro.nodos.push(tn.name);
    }
  }
  return { morfos, huesos, ns };
}

window.actorInit = async () => {
  const w = CONFIG.w, h = CONFIG.h;
  const cv = document.createElement('canvas');
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  document.body.appendChild(cv);
  engine = new BABYLON.Engine(cv, false,
    { preserveDrawingBuffer: true, stencil: false, antialias: false, alpha: true }, true);
  engine.setHardwareScalingLevel(1);
  engine.setSize(w, h);
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0x10 / 255, 0x15 / 255, 0x1d / 255, 1);
  scene.autoClear = true;
  camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(0, 0, 0), scene);
  camera.fov = 34 * D2R;          // THREE PerspectiveCamera fov es vertical, así también esto.
  camera.minZ = 0.1; camera.maxZ = 100;
  luz();
  suelo();
  const registro = { morfos: [], huesos: [], nodos: [] };
  if (CONFIG.glb) {
    try {
      const imp = await BABYLON.SceneLoader.ImportMeshAsync("", "", CONFIG.glb, scene);
      const raiz = imp.rootMesh;
      // Encuadre automático: un GLB puede venir en centímetros, pies o metros. Sin
      // normalizar altura y apoyo al suelo, la cámara del actor queda dentro del cuerpo.
      const [minV, maxV] = raiz.getHierarchyBoundingVectors(true, (n) => true);
      const tamY = maxV.y - minV.y;
      const tamXZ = { x: (maxV.x - minV.x) / 2 + minV.x, z: (maxV.z - minV.z) / 2 + minV.z };
      const escala = 1.62 / (Math.max(tamY, 1e-3) || 1.62);
      raiz.scaling.set(escala, escala, escala);
      raiz.position.set(-tamXZ.x * escala, -minV.y * escala, -tamXZ.z * escala);
      const { morfos, huesos, ns } = registrarDescendientes(raiz, registro);
      glb = { morfos, huesos, modelo: raiz };
      nodos = ns;
      /* El suelo del set es para la figura procedural (pies en -1.45); un GLB se apoya en y=0. */
      if (floor) floor.position.y = 0;
      /* Encuadre relativo a la cara: sin esto, la cámara del actor mira el pecho de un
         personaje de cuerpo entero y el primer plano no muestra la boca. */
      const cab = ns.get(String(CONFIG.rig_map.cabeza_nodo || 'head').toLowerCase());
      if (cab) {
        raiz.computeWorldMatrix(true);
        cab.obj.computeWorldMatrix(true);
        caraY = cab.obj.getAbsolutePosition().y;
      }
      modo = 'glb';
    } catch (e) {
      console.error('GLB yük falló:', e);
      glb = null;
    }
  }
  if (!glb) figuraProcedural();
  return { modo, registro };
};

/* frame determinista: t -> rig interpolado + visema + blink + cámara -> render */
let estado_tl = null;
let ultimo_ap = 0.1;
window.actorCargar = (tl) => {
  estado_tl = {
    segs: tl.segmentos, plan: tl.camara, cues: tl.cues,
    blinks: tl.blinks, trans_s: tl.trans_s,
  };
};

window.actorFrame = (t) => {
  if (!estado_tl || !engine) return false;
  const rig = rigEn(t, estado_tl.segs, estado_tl.trans_s);
  const ap = visemaEn(t, estado_tl.cues);
  ultimo_ap = ap;
  const blink = blinkEn(t, estado_tl.blinks);
  camaraEn(t, estado_tl.plan);
  if (glb && CONFIG.rig_map && Object.keys(CONFIG.rig_map).length) {
    aplicarAGlb(rig, ap, blink, t);
  }
  if (fig) aplicarAProcedural(rig, ap, blink, t);
  scene.render();
  return true;
};

window.actorSnapshot = () => cvToB64();

function cvToB64() {
  const cv = document.body.querySelector('canvas');
  return cv.toDataURL('image/png').split(',')[1];
}

window.actorEstado = () => ({ modo, apertura_boca: ultimo_ap });
</script>
