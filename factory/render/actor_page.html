<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #10151d; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "/factory/render/vendor/three.module.js" } }
</script>
</head>
<body>
</body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/factory/render/vendor/GLTFLoader.js';

/* Config inyectada por actor.py: __CONFIG__ (JSON con visemas, rig_map y ruta glb) */
const CONFIG = __CONFIG__;

let scene, camera, renderer;
let glb = null;           // datos del GLB cargado
let nodos = null;         // nodos nombrados del GLB: rig por transformación, sin skinning
let caraY = null;         // altura de la cabeza ya normalizada; encuadre relativo a la cara
let floor = null;
let fig = null;           // piezas del actor procedural de validación
let modo = 'init';
const V = CONFIG.visema;

function luz() {
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a3230, 0.55));
  const key = new THREE.DirectionalLight(0xffefd2, 1.15);
  key.position.set(1.6, 2.6, 2.8);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.4);
  rim.position.set(-2.2, 1.4, -2.6);
  scene.add(key, rim);
}

function suelo() {
  const g = new THREE.Mesh(
    new THREE.CircleGeometry(9, 48),
    new THREE.MeshStandardMaterial({ color: 0x1a222e, roughness: 0.9 }));
  g.rotation.x = -Math.PI / 2;
  g.position.y = -1.45;
  floor = g;
  scene.add(g);
}

function m(geo, color) {
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.55 }));
}

/* Actor del personaje 4F (Pulso Curioso) montado proceduralmente sobre SU lámina de
   referencia: paleta neón (#00FF00 / #FF00FF / #00FFFF / #111111 / #1A1A1A), gorra 4F,
   hoodie con tiras neón y ojos glow de visera. Modo declarado 'mascota4f_procedural':
   es el personaje renderizado con geometría liviana; el GLB del usuario lo reemplaza
   por completo vía rig_map cuando llegue a assets/. */
function figuraProcedural() {
  const VERDE = 0x00ff00, MAGENTA = 0xff00ff, CIAN = 0x00ffff;
  const glow = (c) => new THREE.MeshBasicMaterial({ color: c });
  const dark = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, metalness: 0.25 });
  const gloss = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.18, metalness: 0.8 });
  const textura4F = () => {
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 96;
    const cx = cv.getContext('2d');
    cx.clearRect(0, 0, 128, 96);
    cx.font = 'bold 56px monospace';
    cx.fillStyle = '#00ff00';
    cx.textAlign = 'center';
    cx.shadowColor = '#00ff00'; cx.shadowBlur = 14;
    cx.fillText('4F', 64, 68);
    const t = new THREE.CanvasTexture(cv);
    t.needsUpdate = true;
    return t;
  };
  const g = new THREE.Group();
  const cuello = new THREE.Group();
  const cabeza = new THREE.Group();

  // casco táctico glossy cerrado (prohibida la cara orgánica; lámina: visera digital)
  const craneo = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), gloss(0x0e0e0e));
  craneo.scale.set(1, 1.14, 0.92);
  const capucha = new THREE.Mesh(new THREE.SphereGeometry(0.56, 24, 16, 0, Math.PI * 2, Math.PI * 0.52, Math.PI * 0.48), dark(0x1a1a1a));
  capucha.position.z = -0.08; capucha.scale.set(1, 0.92, 1);
  const gorroBanda = new THREE.Mesh(new THREE.SphereGeometry(0.505, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.34), dark(0x141414));
  gorroBanda.position.y = 0.1;
  // visera: panel de vidrio negro al frente
  const visor = new THREE.Mesh(
    new THREE.SphereGeometry(0.507, 32, 16, -0.62, 1.24, 1.33, 0.78),
    new THREE.MeshStandardMaterial({ color: 0x0b0b0b, roughness: 0.12, metalness: 0.75 }));
  // logo 4F glow verde en la banda del casco
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.105),
    new THREE.MeshBasicMaterial({ map: textura4F(), transparent: true }));
  logo.position.set(0.0, 0.33, 0.42);
  logo.rotation.x = -0.35;
  // ojos glow de la visera (párpados asimétricos aplicados por rotación)
  const ojoL = new THREE.Mesh(new THREE.CircleGeometry(0.105, 20), glow(VERDE));
  ojoL.position.set(-0.175, 0.075, 0.478);
  ojoL.rotation.z = -0.35;
  const ojoR = new THREE.Mesh(new THREE.CircleGeometry(0.105, 20), glow(VERDE));
  ojoR.position.set(0.175, 0.075, 0.478);
  ojoR.rotation.z = 0.35;
  // fila de SÍMBOLOS bajo los ojos: pulsan con la LOCUCIÓN (lip-sync del casco)
  // -> nada de labios orgánicos; el brillo sigue la apertura del visema (Rhubarb)
  const symbols = [];
  for (const [i, x] of [[0, -0.085], [1, 0], [2, 0.085]].entries()) {
    const s = new THREE.Mesh(new THREE.CircleGeometry(0.028, 14), glow(VERDE));
    s.position.set(x, -0.135 + (i === 1 ? 0.022 : 0), 0.49);
    symbols.push(s);
    cabeza.add(s);
  }
  cabeza.add(craneo, capucha, gorroBanda, visor, logo, ojoL, ojoR);

  // torso/h/video: hoodie negro con tiras neón magenta+cian (lámina, sin morphing)
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.5, 8, 20), dark(0x151515));
  torso.position.y = -0.95;
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.05, 8, 24), dark(0x1a1a1a));
  collar.rotation.x = Math.PI / 2; collar.position.y = -0.42;
  const tiraM = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.5, 6), glow(MAGENTA));
  tiraM.rotation.z = 0.12; tiraM.position.set(-0.08, -0.62, 0.37);
  const tiraC = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.5, 6), glow(CIAN));
  tiraC.rotation.z = -0.12; tiraC.position.set(0.08, -0.62, 0.37);
  const brazoL = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.4, 6, 12), dark(0x151515));
  brazoL.position.set(-0.45, -0.78, 0);
  const brazoR = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.4, 6, 12), dark(0x151515));
  brazoR.position.set(0.45, -0.78, 0);
  const punoL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), glow(CIAN));
  punoL.position.set(-0.45, -1.02, 0);
  const punoR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), glow(MAGENTA));
  punoR.position.set(0.45, -1.02, 0);

  g.add(cuello, torso, collar, tiraM, tiraC, brazoL, brazoR, punoL, punoR);
  cuello.position.y = 0.05;
  cuello.add(cabeza);
  cabeza.position.y = 0.62;
  g.position.y = -0.55;
  scene.add(g);
  fig = { g, cuello, cabeza, ojoL, ojoR, symbols, brazoL, brazoR,
          verde: new THREE.Color(VERDE) };
  modo = 'mascota4f_procedural';
}

/* Aplica el rig (bloque de estados.py) + visema + blink al actor 4F.
   REGLAS duras: sin flicker (brillo determinista de t), sin morphing activo,
   proporciones fijas (solo transformaciones de la propia figura). */
function aplicarAProcedural(rig, apertura, ojoFactor, t) {
  const { g, cuello, ojoL, ojoR, symbols, brazoL, brazoR, verde } = fig;
  g.rotation.z = THREE.MathUtils.degToRad(rig.postura_roll || 0) * 0.6;
  g.position.x = (rig.peso || 0) * 0.06;
  // inclinar torso para adelante cuando explica datos (manos activas)
  g.rotation.x = 0.07 * (rig.manos_levantadas || 0);
  cuello.rotation.x = THREE.MathUtils.degToRad(rig.cabeza_pitch || 0);
  cuello.rotation.y = THREE.MathUtils.degToRad(rig.cabeza_yaw || 0);
  cuello.rotation.z = THREE.MathUtils.degToRad(rig.cabeza_roll || 0);
  const dx = rig.mirada_dx || 0, dy = rig.mirada_dy || 0;
  ojoL.position.x = -0.175 + dx * 0.03;
  ojoR.position.x = 0.175 + dx * 0.03;
  const ci = rig.ceja_izq || 0, cd = rig.ceja_der || 0;
  // párpados asimétricos por emoción (lámina 4F) + apertura/parpadeo
  const ab = Math.max(0.06, Math.min(1.35, (rig.ojo_apertura || 1) * ojoFactor));
  ojoL.scale.y = ab; ojoR.scale.y = ab;
  ojoL.rotation.z = -0.35 + ci * 0.55;
  ojoR.rotation.z = 0.35 - cd * 0.55;
  ojoL.position.y = 0.075 + dy * 0.025 + ci * 0.02;
  ojoR.position.y = 0.075 + dy * 0.025 + cd * 0.02;
  // lip-sync del casco: los tres símbolos pulsan con la locución (visema) y
  // se atenúan en silencios; brillo determinista de t (sin flicker)
  const brillo = 0.22 + Math.min(1.2, apertura) * 1.6;
  for (let i = 0; i < symbols.length; i++) {
    const s = symbols[i];
    const fase = 0.85 + 0.15 * Math.sin(t * 6.28 + i * 1.1);
    s.material.color.copy(verde).multiplyScalar(Math.min(2, brillo * fase));
    s.scale.y = 0.45 + apertura * 0.9;
    s.scale.x = 1 - apertura * 0.12;
  }
  const vel = rig.velocidad_gesto || 1;
  const sw = Math.sin(t * 2.1 * vel) * 0.1;
  brazoL.rotation.x = (rig.brazo_izq || 0) * 0.7 + sw;
  brazoR.rotation.x = (rig.brazo_der || 0) * 0.7 - sw;
  brazoL.rotation.z = 0.12 + (rig.codo_izq || 0) * 0.5;
  brazoR.rotation.z = -0.12 - (rig.codo_der || 0) * 0.5;
  brazoL.position.y = -0.78 + (rig.manos_levantadas || 0) * 0.25;
  brazoR.position.y = -0.78 + (rig.manos_levantadas || 0) * 0.25;
  g.scale.y = 1 + Math.sin(t * ((rig.respiracion || 14) / 60) * 2 * Math.PI) * 0.008;
}

/* Aplica rig al GLB vía rig_map: {morfos:{param:[nombres...]}, huesos:{param:[nombre,eje,signo...]}} */
/* Rig por NODOS: un personaje sin pesos de vértice (nuestro cloak man) se anima moviendo
   transformaciones de nodo. Cada def es [nodo, op, eje, factor, modo?]:
     rot  -> grados por unidad      pos -> metros sobre la posición base
     esc  -> escala base + v*factor; con modo "fija" la escala ES v (apertura ocular).  */
function nodoDe(nombre) { return nodos ? nodos.get(String(nombre).toLowerCase()) : null; }

function aplicarNodo(def, v) {
  const reg = nodoDe(def[0]);
  if (!reg) return false;
  const [, op, eje, factor, modoEsc] = def;
  const f = factor === undefined ? 1 : factor;
  if (op === 'rot') reg.obj.rotation[eje] = THREE.MathUtils.degToRad(v * f);
  else if (op === 'pos') reg.obj.position[eje] = reg.basePos[eje] + v * f;
  else if (op === 'esc') reg.obj.scale[eje] = modoEsc === 'fija'
    ? Math.max(0.03, Math.min(1.6, v)) : Math.max(0.02, reg.baseScale[eje] + v * f);
  return true;
}

function aplicarAGlb(rig, apertura, ojoFactor, t) {
  if (!glb) return;
  const morfos = CONFIG.rig_map.morfos || {};
  for (const [param, claves] of Object.entries(morfos)) {
    let v = rig[param];
    if (v === undefined) continue;
    if (param === 'ojo_apertura') v = Math.max(0.05, Math.min(1.35, v * ojoFactor));
    for (const c of claves) {
      for (const { obj, idx } of glb.morfos.get(c) || []) {
        obj.morphTargetInfluences[idx] = Math.max(0, Math.min(1, v));
      }
    }
  }
  /* visema sobre morfos de boca si el GLB define 'mouthOpen' u similares */
  const bocaKeys = CONFIG.rig_map.visema_morphs || ['mouthOpen'];
  for (const c of bocaKeys) {
    for (const { obj, idx } of glb.morfos.get(c) || []) {
      obj.morphTargetInfluences[idx] = Math.max(0, Math.min(1, apertura));
    }
  }
  const huesos = CONFIG.rig_map.huesos || {};
  for (const [param, defs] of Object.entries(huesos)) {
    let v = rig[param];
    if (v === undefined) continue;
    for (const d of defs) {
      const [nombre, eje, signo] = d;
      const b = glb.huesos.get(String(nombre).toLowerCase());
      if (b) b.rotation[eje] = THREE.MathUtils.degToRad(v) * (signo === undefined ? 1 : signo);
    }
  }
  /* --- rig por nodos (personajes sin skinning) --- */
  const ojoAp = Math.max(0.05, Math.min(1.35, (rig.ojo_apertura === undefined ? 1 : rig.ojo_apertura) * ojoFactor));
  for (const [param, defs] of Object.entries(CONFIG.rig_map.nodos || {})) {
    let v = rig[param];
    if (v === undefined) continue;
    if (param === 'ojo_apertura') v = ojoAp;
    for (const d of defs) aplicarNodo(d, v);
  }
  for (const d of (CONFIG.rig_map.visema_nodos || [])) aplicarNodo(d, apertura);
  const rb = CONFIG.rig_map.respiracion_nodo && nodoDe(CONFIG.rig_map.respiracion_nodo);
  if (rb) {
    const rpm = rig.respiracion || 14;
    rb.obj.scale.y = rb.baseScale.y * (1 + Math.sin(t * (rpm / 60) * 2 * Math.PI) * 0.014);
  }
}

/* cámara: plano/movimiento de la timeline -> posición suave */
function camaraEn(t, plan) {
  let plano = plan[plan.length - 1];
  for (const p of plan) if (t >= p.t0 && t < p.t1) { plano = p; break; }
  const DIST = { primerisimo_primer_plano: 1.05, primer_plano: 1.5, medio: 2.6, general: 4.2, contrapicado: 2.0 };
  const ALT = { primerisimo_primer_plano: 0.95, primer_plano: 1.05, medio: 1.15, general: 1.25, contrapicado: 0.55 };
  const CARA = { primerisimo_primer_plano: [0.85, 0.00, 0.00], primer_plano: [1.20, 0.03, -0.03],
                 medio: [2.05, 0.06, -0.18], general: [3.10, 0.14, -0.42], contrapicado: [1.50, -0.34, 0.05] };
  let d = DIST[plano.tipo] ?? 2.6;
  let alt = ALT[plano.tipo] ?? 1.1;
  let lookY = alt - 0.12;
  if (caraY !== null) {
    /* Con un GLB de cuerpo entero la cara no está en y=1.1: el plano se define RELATIVO
       a la cabeza, si no el primer plano sale encuadrando el pecho. */
    const c = CARA[plano.tipo] ?? CARA.medio;
    d = c[0]; alt = caraY + c[1]; lookY = caraY + c[2];
  }
  let dx = 0, dz = 0;
  const frac = Math.min(1, Math.max(0, (t - plano.t0) / Math.max(0.1, plano.t1 - plano.t0)));
  if (plano.mov === 'zoom_lento') dz = -0.35 * frac;
  if (plano.mov === 'acercamiento_lento') dz = -0.55 * frac;
  if (plano.mov === 'lento_lateral') dx = 0.4 * Math.sin((t - plano.t0) * 0.4);
  if (plano.mov === 'leve_travelling') dx = 0.18 * Math.sin((t - plano.t0) * 0.5);
  if (plano.mov === 'titubeo') { dx = 0.04 * Math.sin(t * 5.3); dz = 0.03 * Math.sin(t * 4.1); }
  camera.position.set(dx, alt + 0.08 * Math.sin(t * 0.5), d + dz);
  camera.lookAt(0, lookY, 0.25);
}

/* interpolación suave entre el bloque del segmento activo y el siguiente (0.45 s) */
function rigEn(t, segs, trans_s) {
  let rig = null;
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (t < s.t0) { rig = i > 0 ? segs[i - 1].rig : segs[0].rig; break; }
    if (t >= s.t0 && t < s.t1) {
      const nx = segs[Math.min(segs.length - 1, i + 1)];
      const a = Math.min(1, (t - s.t0) / trans_s);
      rig = {};
      for (const k of Object.keys(s.rig)) rig[k] = s.rig[k] + ((nx.rig[k] ?? s.rig[k]) - s.rig[k]) * a;
      break;
    }
    rig = s.rig;
  }
  if (!rig) rig = segs[segs.length - 1] ? segs[segs.length - 1].rig : {};
  return rig;
}

function visemaEn(t, cues) {
  let vis = 'X', edad = 1e9;
  for (const c of cues) { if (c.t <= t) { vis = c.v; edad = t - c.t; } else break; }
  // La mandíbula no se queda congelada en el último fonema: se relaja hacia el reposo.
  if (edad > 0.22) vis = 'X';
  return V[vis] ?? 0.1;
}

function blinkEn(t, blinks) {
  let f = 1;
  for (const b of blinks) {
    if (Math.abs(t - b) < 0.09) f = Math.min(f, Math.abs(t - b) / 0.09);
  }
  return Math.max(0.06, f);
}

window.actorInit = async () => {
  const w = CONFIG.w, h = CONFIG.h;
  renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(w, h);
  document.body.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x10151d);
  camera = new THREE.PerspectiveCamera(34, w / h, 0.1, 100);
  luz();
  suelo();
  const registro = { morfos: [], huesos: [], nodos: [] };
  if (CONFIG.glb) {
    try {
      await new Promise((ok, fail) => new GLTFLoader().load(CONFIG.glb, (g) => {
        scene.add(g.scene);
        // Encuadre automático: un GLB puede venir en centímetros, pies o metros. Sin
        // normalizar altura y apoyo al suelo, la cámara del actor queda dentro del cuerpo.
        const caja = new THREE.Box3().setFromObject(g.scene);
        const tam = new THREE.Vector3(), cent = new THREE.Vector3();
        caja.getSize(tam); caja.getCenter(cent);
        const escala = 1.62 / (tam.y || 1.62);
        g.scene.scale.setScalar(escala);
        g.scene.position.set(-cent.x * escala, -caja.min.y * escala, -cent.z * escala);
        const morfos = new Map(), huesos = new Map(), ns = new Map();
        g.scene.traverse((o) => {
          if (o.morphTargetDictionary) {
            for (const [k, idx] of Object.entries(o.morphTargetDictionary)) {
              if (!morfos.has(k)) morfos.set(k, []);
              morfos.get(k).push({ obj: o, idx });
            }
            registro.morfos.push(...Object.keys(o.morphTargetDictionary));
          }
          if (o.isBone) { huesos.set(o.name.toLowerCase(), o); registro.huesos.push(o.name); }
          /* traverse va del padre al hijo: el primero con ese nombre ES el nodo glTF */
          if (o.name && !ns.has(o.name.toLowerCase())) {
            ns.set(o.name.toLowerCase(), { obj: o,
              basePos: [o.position.x, o.position.y, o.position.z],
              baseScale: [o.scale.x, o.scale.y, o.scale.z] });
            registro.nodos.push(o.name);
          }
        });
        glb = { morfos, huesos, modelo: g.scene };
        nodos = ns;
        scene.updateMatrixWorld(true);
        /* El suelo del set es para la figura procedural (pies en -1.45); un GLB se apoya en y=0. */
        if (floor) floor.position.y = 0;
        /* Encuadre relativo a la cara: sin esto, la cámara del actor mira el pecho de un
           personaje de cuerpo entero y el primer plano no muestra la boca. */
        const cab = ns.get(String(CONFIG.rig_map.cabeza_nodo || 'head').toLowerCase());
        if (cab) { const v = new THREE.Vector3(); cab.obj.getWorldPosition(v); caraY = v.y; }
        modo = 'glb';
        ok();
      }, undefined, (e) => fail(e)));
    } catch (e) {
      console.error('GLB yük falló:', e);
      glb = null;
    }
  }
  if (!glb) figuraProcedural();
  return { modo, registro };
};

/* frame determinista: t -> rig interpolado + visema + blink + cámara -> render */
let estado_tl = null;
let ultimo_ap = 0.1;
window.actorCargar = (tl) => {
  estado_tl = {
    segs: tl.segmentos, plan: tl.camara, cues: tl.cues,
    blinks: tl.blinks, trans_s: tl.trans_s,
  };
};

window.actorFrame = (t) => {
  if (!estado_tl || !renderer) return false;
  const rig = rigEn(t, estado_tl.segs, estado_tl.trans_s);
  const ap = visemaEn(t, estado_tl.cues);
  ultimo_ap = ap;
  const blink = blinkEn(t, estado_tl.blinks);
  camaraEn(t, estado_tl.plan);
  if (glb && CONFIG.rig_map && Object.keys(CONFIG.rig_map).length) {
    aplicarAGlb(rig, ap, blink, t);
  }
  if (fig) aplicarAProcedural(rig, ap, blink, t);
  renderer.render(scene, camera);
  return true;
};

window.actorSnapshot = () => renderer.domElement.toDataURL('image/png').split(',')[1];
window.actorEstado = () => ({ modo, apertura_boca: ultimo_ap });
</script>
</html>
